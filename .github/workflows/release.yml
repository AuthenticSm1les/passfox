name: Release

# Push a tag matching the manifest version (e.g. v0.3.1) to publish a GitHub
# release and submit the add-on to addons.mozilla.org (listed, with the
# listing in amo/metadata.json). Needs the repo secrets AMO_JWT_ISSUER and
# AMO_JWT_SECRET (an API key from https://addons.mozilla.org/developers/addon/api/key/).
#
# The GitHub release goes out first and the AMO submission doesn't wait for
# approval: listed versions are reviewed by people, which takes hours or
# days. AMO signs and publishes the version once it's approved.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lint
        run: python3 -I tools/lint.py

      - name: Package native host
        run: |
          mkdir -p "dist/passfox-host-$VERSION/host"
          cp install.sh "dist/passfox-host-$VERSION/"
          cp host/passfox_host.py host/io.github.smiley.passfox.json "dist/passfox-host-$VERSION/host/"
          tar -C dist -czf "dist/passfox-host-$VERSION.tar.gz" "passfox-host-$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Already there when a failed run is re-run.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" "dist/passfox-host-$VERSION.tar.gz" \
            --title "passfox $VERSION" \
            --notes "Install passfox from addons.mozilla.org (https://addons.mozilla.org/firefox/addon/passfox/) once this version is approved, then install the native host: \`passfox-host\` from the AUR on Arch Linux, or run install.sh from passfox-host-$VERSION.tar.gz (or the repository)."

      - name: Submit to addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # AMO throttles uploads for a minute or so (for example while the
          # listing workflow is editing); try again rather than fail.
          set -o pipefail
          for attempt in 1 2 3 4; do
            npx --yes web-ext@8 sign \
              --source-dir extension \
              --artifacts-dir dist \
              --channel listed \
              --amo-metadata amo/metadata.json \
              --approval-timeout 0 \
              --api-key "$AMO_JWT_ISSUER" \
              --api-secret "$AMO_JWT_SECRET" 2>&1 | tee sign.log && exit 0
            grep -q "throttled" sign.log || exit 1
            echo "AMO throttled the upload; trying again in 90s"
            sleep 90
          done
          exit 1
