name: Release

# Push a tag matching the manifest version (e.g. v0.1.0) to build, sign and
# publish the add-on. Needs the repo secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (an API key from https://addons.mozilla.org/developers/addon/api/key/).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir extension --self-hosted

      - name: Sign (unlisted, self-distributed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          mv dist/*.xpi "dist/passfox-$VERSION.xpi"

      - name: Package native host
        run: |
          mkdir -p "dist/passfox-host-$VERSION/host"
          cp install.sh "dist/passfox-host-$VERSION/"
          cp host/passfox_host.py host/io.github.smiley.passfox.json "dist/passfox-host-$VERSION/host/"
          tar -C dist -czf "dist/passfox-host-$VERSION.tar.gz" "passfox-host-$VERSION"

      - name: Write updates.json
        run: |
          python3 -I tools/updates-json.py "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/passfox-$VERSION.xpi" \
            > dist/updates.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/passfox-$VERSION.xpi" \
            "dist/passfox-host-$VERSION.tar.gz" \
            dist/updates.json \
            --title "passfox $VERSION" \
            --notes "Install: open passfox-$VERSION.xpi in Firefox, then run install.sh from passfox-host-$VERSION.tar.gz (or the repository) to register the native host."
