name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pass
        run: sudo apt-get update && sudo apt-get install -y pass
      - name: Native host tests
        run: python3 -I test/host_test.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Passwords page handlers (end to end)
        run: node test/manager_test.mjs
      - name: Lint extension
        run: python3 -I tools/lint.py
