<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Change password</title><link rel="stylesheet" href="site.css"></head>
<body>
<nav><a href="index.html">All tests</a></nav>
<h1>Change password</h1>
<form method="post" action="/change">
  <label>Username <input name="username" autocomplete="username"></label>
  <label>Current password <input name="old" type="password" autocomplete="current-password"></label>
  <label>New password <input name="new" type="password" autocomplete="new-password"></label>
  <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password"></label>
  <button>Change password</button>
</form>
<div class="expect">
<h2>What to check</h2>
<ul>
<li>Enter a saved username, its current password, and the same new password twice.</li>
<li>The doorhanger offers "Update password for localhost?" with the <em>new</em> password (the one typed twice).</li>
<li>Update keeps any extra lines (url:, notes) in the pass entry.</li>
</ul>
</div>
</body>
</html>
