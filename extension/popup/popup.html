<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Passwords</title>
    <link rel="stylesheet" href="../vendor/firefox/tokens-shared.css" />
    <link rel="stylesheet" href="../vendor/firefox/tokens-platform.css" />
    <link rel="stylesheet" href="../shared/firefox.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panelview">
      <header class="panel-header"><h1>Passwords</h1></header>
      <div class="separator"></div>
      <div class="search">
        <input id="search" type="search" placeholder="Search Passwords" autocomplete="off" spellcheck="false" />
      </div>
      <div id="list" class="panel-subview-body" role="listbox" aria-label="Passwords"></div>
      <p id="message" class="message" hidden></p>
      <footer id="footer">
        <div class="separator"></div>
        <div class="panel-subview-body">
          <button id="manage" class="subviewbutton">Manage Passwords</button>
        </div>
      </footer>
    </main>
    <script src="../shared/icons.js"></script>
    <script src="../content/ui.js"></script>
    <script src="../shared/doorhanger.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
