<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>passfox Settings</title>
    <link rel="stylesheet" href="/vendor/firefox/chrome/global/skin/in-content/common.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!-- Laid out like Firefox's Settings → Privacy & Security → Passwords. -->
    <h2>Passwords</h2>

    <div class="setting">
      <label title="Firefox’s own “Ask to save passwords” is turned off while passfox is installed, so you’re only asked once. Passwords are saved to pass, with pass’s settings."><input type="checkbox" id="ask-to-save" /> Ask to save passwords</label>
      <div class="buttons">
        <button id="show-exceptions" aria-expanded="false" aria-controls="exceptions">Exceptions…</button>
        <button id="manage">Manage saved passwords</button>
      </div>
    </div>

    <section id="exceptions" class="exceptions" hidden aria-labelledby="exceptions-title">
      <h3 id="exceptions-title">Exceptions</h3>
      <p class="description">passfox won't ask to save passwords for these websites.</p>
      <ul id="exception-list"></ul>
      <p id="no-exceptions" class="description" hidden>No websites yet. Choose “Never save” in a save prompt to add one.</p>
      <button id="remove-all" disabled>Remove All Websites</button>
    </section>

    <div class="setting nested">
      <label><input type="checkbox" id="suggest-passwords" /> Suggest strong passwords</label>
    </div>

    <h2 class="section">Password store</h2>
    <div class="setting folder">
      <label for="login-pattern" title="A folder in your password store, like www, or a pattern such as www/{url}/{username}. {domain} is the website without its ending.">Where logins are stored</label>
      <input type="text" id="login-pattern" placeholder="{url}/{username}" spellcheck="false" autocomplete="off" title="A folder in your password store, like www, or a pattern such as www/{url}/{username}. {domain} is the website without its ending." aria-describedby="login-pattern-error" />
      <a class="learn-more" href="https://github.com/AuthenticSm1les/passfox#your-store" target="_blank" rel="noopener">Learn more</a>
    </div>
    <p id="login-pattern-error" class="error" hidden></p>

    <div class="setting">
      <label title="Also offers github.com’s logins and codes on github.org. A look-alike website registered under another ending would be offered them too."><input type="checkbox" id="ignore-tld" /> Ignore website endings in suggestions (unsafe)</label>
      <a class="learn-more" href="https://github.com/AuthenticSm1les/passfox#settings" target="_blank" rel="noopener">Learn more</a>
    </div>

    <div class="setting">
      <label title="Off: codes come from the otpauth:// line in each login’s entry. On: from the folder or pattern below."><input type="checkbox" id="otp-separate" /> Store one-time codes in a different place</label>
      <a class="learn-more" href="https://github.com/AuthenticSm1les/passfox#fill-a-two-step-verification-code" target="_blank" rel="noopener">Learn more</a>
    </div>
    <div class="setting folder nested">
      <label for="otp-pattern" title="A folder or pattern like the one for logins, such as otp/{url} or otp/{domain}.">Where one-time codes are stored</label>
      <input type="text" id="otp-pattern" placeholder="otp/{url}" spellcheck="false" autocomplete="off" disabled title="A folder or pattern like the one for logins, such as otp/{url} or otp/{domain}." aria-describedby="otp-pattern-error" />
    </div>
    <p id="otp-pattern-error" class="error" hidden></p>

    <script src="options.js"></script>
  </body>
</html>
